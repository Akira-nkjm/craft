# Mission system — Config + Payload コンポーネント
#
# Source: ONGLAISAT（6U 地球観測 CubeSat, TASA × ISSL 東大 × ArkEdge）
#   - C2A フライトソフト Mode Manager（運用モード・権威）
#     99_Sources/raw/tlm_cmd_db, s2e-mobc-settings/.../command_sender/*.ops
#   - TLE (NORAD 62299) / S2E satellite.ini（軌道要素）
#   - Power Overview §5（活動オーバーレイの消費電力）
#   - Payload: S2E telescope.ini / rsi.ini、宇科連2023（Tsutsui ほか）、
#     質量シート mass_inertia_breakdown.csv「4.Mission」



# === Mission Profile ===

[missionprofile]
duration_years = 0.17 # ISS 放出後 約2か月の短寿命実証フェーズ（自然減衰軌道）
target_altitude_km = 410.0 # 撮像高度 約410 km（ISS 放出軌道）
primary_payload = "earth_observation" # 主ペイロード: 高分解能光学地球観測（GSD 2.5–3 m）
contact_frequency_per_day = 5 # S 帯地上局可視回数（沖縄/牧之原/台湾）概算
launch_window_start = "2024-11-05T00:00:00Z" # Falcon 9 / CRS SpX-31 打上げ (JST)
flight_mass_kg = 8.925 # [確定値] フライト全機質量（S2E satellite_structure.ini）= 質量バジェット基準



# === Mass Properties（全機慣性テンソル対角・衛星座標系）===
# [確定値] S2E satellite_structure.ini [KINEMATIC_PARAMETERS]。AOCS 外乱・構体解析の共通参照源。

[massproperties]
ixx_kg_m2 = 0.151 # [確定値 S2E]
iyy_kg_m2 = 0.164 # [確定値 S2E]（最大主慣性軸）
izz_kg_m2 = 0.108 # [確定値 S2E]（最小 = 長軸 Z）



# === Orbital Parameters ===
# TLE (NORAD 62299):
#   2 62299  51.6304 175.9676 0010096 289.2373  70.7536 15.81807777 10864

[orbitalparameters]
semi_major_axis_km = 6788.137 # Re(6378.137) + 410 km
eccentricity = 0.001 # TLE 0.0010096（ほぼ円）
inclination_deg = 51.63 # TLE 51.6304°（ISS 軌道）
raan_deg = 175.97 # TLE 175.9676°
arg_periapsis_deg = 289.24 # TLE 289.2373°
mean_anomaly_deg = 70.75 # TLE 70.7536°
epoch_utc = "2024-12-10T00:00:00Z" # 運用開始時期（通信確立 2024-12-09〜10）



# === Operation Mode Config ===
#
# Source: ONGLAISAT C2A Mode Manager（一次情報）
#   - AOBC 遷移: INITIAL→BDOT→ROUGH_SUN_POINTING→R3ax-MTQ→R3ax-RW→FINE_THREE_AXIS
#   - MOBC: INITIAL→NOMINAL、撮像シーケンス（撮像 1.5 分後に NOMINAL 復帰）
# 消費電力の目安は Power Overview §5（CDH 基盤 ~7.7W を基準に活動分を加算）。

# --- 姿勢制御チェーン (C2A AOBC Mode Manager) ---

[operation_mode_configs.initial]
description = "起動直後。最小構成（CDH のみ）、姿勢制御なし。C2A INITIAL"
max_duration_s = 0.0
is_initial_mode = true
allowed_transitions = ["bdot"]

[operation_mode_configs.bdot]
description = "B-dot デタンブル。MTQ + 磁気センサで角運動量を減衰。C2A BDOT"
max_duration_s = 0.0
is_initial_mode = false
allowed_transitions = ["initial", "rough_sun_pointing"]

[operation_mode_configs.rough_sun_pointing]
description = "粗太陽捕捉。太陽センサ + MTQ で SAP を太陽方向へ。C2A ROUGH_SUN_POINTING"
max_duration_s = 0.0
is_initial_mode = false
allowed_transitions = ["bdot", "rough_three_axis_mtq"]

[operation_mode_configs.rough_three_axis_mtq]
description = "粗三軸（MTQ 制御）。磁気トルカ主体の三軸安定。C2A ROUGH_THREE_AXIS_MTQ"
max_duration_s = 0.0
is_initial_mode = false
allowed_transitions = ["rough_sun_pointing", "rough_three_axis_rw"]

[operation_mode_configs.rough_three_axis_rw]
description = "粗三軸（RW 制御）。リアクションホイール主体の三軸安定。C2A ROUGH_THREE_AXIS_RW"
max_duration_s = 0.0
is_initial_mode = false
allowed_transitions = ["rough_three_axis_mtq", "fine_three_axis"]

[operation_mode_configs.fine_three_axis]
description = "精三軸（STT + RW + 精ジャイロ）。撮像可能な高精度指向。C2A FINE_THREE_AXIS / MOBC NOMINAL"
max_duration_s = 0.0
is_initial_mode = false
allowed_transitions = ["rough_three_axis_rw", "imaging", "xband_downlink"]

# --- 活動オーバーレイ (MOBC ミッション / Power Overview §5) ---

[operation_mode_configs.imaging]
description = "撮像実行。fine_three_axis 姿勢 + MISSION_IF/1/2 ON。消費 ~29.5W（撮像系 21.75W + CDH 7.7W）"
max_duration_s = 120.0 # 撮像は短時間（main_sequence.ops の撮像窓）
is_initial_mode = false
allowed_transitions = ["fine_three_axis", "xband_downlink"]

[operation_mode_configs.xband_downlink]
description = "X帯ダウンリンク。fine_three_axis 姿勢 + XTx(36Mbps) ON。消費 ~24W（XTx 16.15W + CDH 7.7W）"
max_duration_s = 600.0 # 地上局可視時間オーダー
is_initial_mode = false
allowed_transitions = ["fine_three_axis", "imaging"]



# ============================================================
# === Payload Components (ONGLAISAT Mission Payload) ===
# ============================================================
#
# Source: S2E telescope.ini / rsi.ini / mission_if.ini
#         宇科連2023（Tsutsui ほか）/ PCDU チャネル情報（Power Overview §5）
#         質量シート mass_inertia_breakdown.csv「4.Mission」
#
# 撮像チェーン: 地表シーン → Korsch 光学系 → TDI センサ → RSI/FPA →
#   Mission IF → MOBC（画像処理・圧縮）→ XTx → 地上局



# === Telescope (RSI — Korsch オフアクシス光学系) ===
#
# TASA 製 Korsch 型オフアクシス 3 枚鏡系。受動系（電力消費なし）。
# LoS = コンポーネント +X 軸（telescope.ini quaternion_b2c）。
# 質量: カメラアセンブリ 699.61 g（不完全フラグ、CCC/内部/レンズ未計上）
#       光学系単体は未分離 → 推測 TBD [推測]

[telescope.spec]
mass_kg = 2.525                   # [推定] Korsch 光学系 + カメラ内部 + レンズ + CCC 基板。CSV camera+cover は 699.61g だが「圧倒的に足りない(ccc基板,カメラ中身,レンズ)」と明記。フライト質量 8.925kg と CSV 実測内訳(~6.2kg)の差の主因をここに計上（光学系は TASA 非公開）
focal_length_m = 0.725            # [確定値: S2E telescope.ini focal_length_m = 0.725]
aperture_diameter_m = 0.145       # [推測] f/5 仮定 → Ø145 mm（実機 TASA 非公開）
f_number = 5.0                    # [推測] D=Ø145 mm / f=725 mm = f/5
pixel_size_m = 5.0e-6             # [確定値: S2E telescope.ini pixel_size_m = 5.0e-6 m]
ifov_rad = 6.897e-6               # [確定値] pixel_size_m / focal_length_m = 5e-6 / 0.725
sun_exclusion_angle_deg = 60.0    # [確定値: S2E telescope.ini sun_exclusion_angle_deg = 60]
earth_exclusion_angle_deg = 60.0  # [確定値: S2E telescope.ini earth_exclusion_angle_deg = 60]
moon_exclusion_angle_deg = 60.0   # [確定値: S2E telescope.ini moon_exclusion_angle_deg = 60]
telescope_type = "Korsch off-axis"
manufacturer = "TASA"

[telescope.design]
quantity = 1                      # RSI × 1 台

[telescope.design.placement]
face = "PX"                       # LoS = +X（telescope.ini quaternion_b2c から）
u = 0.0
v = 0.0
w = 0.0
dx = 100.0                        # [TBD] 6U 短辺 100 mm
dy = 100.0                        # [TBD]
dz = 340.0                        # [TBD] 6U 長辺 340 mm（折返し光路）
rz = 0.0
side = "IN"
cad_file = ""
cad_offset_x = 0.0
cad_offset_y = 0.0
cad_offset_z = 0.0
update_bbox = 0

[telescope.meta]
notes = "RSI（Remote Sensing Instrument）= ミッション望遠鏡の正式名称 [宇科連2023]。Korsch 3 枚鏡系、f=725mm、pixel=5μm。質量はカメラアセンブリ 699.61g から推測（光学系単体未分離）"



# === ImageSensor (CMOS-TDI ラインセンサ, TSRI) ===
#
# TSRI 製 CMOS-TDI ラインセンサ。32×8192 px、TDI 8 段。
# PCDU チャネル MISSION_1 = 11.51 W [確定値: Power Overview §5]

[image_sensors.spec]
mass_kg = 0.1                     # [推測] センサ + FPA 単体質量（カメラアセンブリから未分離）
temp_min_c = -20.0                # [推測] CMOS TDI 典型動作温度下限
temp_max_c = 60.0                 # [推測] CMOS TDI 典型動作温度上限
power_per_unit_w = 11.51          # [確定値: PCDU MISSION_1 = 11.51 W（Power Overview §5）]
tdi_direction_pixels = 32        # TDI 段（積分）方向の物理画素数。出典で軸名が逆（telescope.ini x=32 / tdi-analysis y=32）のため物理方向で記載
cross_track_pixels = 8192        # クロストラック（スワス）方向の画素数。telescope.ini y=8192 / tdi-analysis x=8192
pixel_size_m = 5.0e-6             # [確定値: S2E telescope.ini pixel_size_m = 5.0e-6 m]
tdi_stages = 8                    # [確定値: S2E telescope.ini stage_mode = 8]
tdi_max_stages = 32               # [確定値: 物理配列 X 方向 = 32 段]
line_rate_s = 0.000423            # [確定値: TDI-analysis 最適化値 line_rate = 0.000423 s]
lines_per_frame = 378             # [確定値: TDI-analysis 1 フレーム = 378 ライン]
frames_per_mission = 10           # [確定値: S2E telescope.ini number_of_frames_per_mission = 10]
sensor_type = "CMOS TDI"
manufacturer = "TSRI"

[image_sensors.rsi_tdi.design]
quantity = 1
bits_per_pixel = 10               # [推測] 10–12 bit 典型

[image_sensors.rsi_tdi.design.placement]
face = "PX"
u = 0.0
v = 0.0
w = 0.0
dx = 50.0                         # [TBD] FPA アセンブリ寸法
dy = 50.0                         # [TBD]
dz = 30.0                         # [TBD]
rz = 0.0
side = "IN"
cad_file = ""
cad_offset_x = 0.0
cad_offset_y = 0.0
cad_offset_z = 0.0
update_bbox = 0

[image_sensors.rsi_tdi.design.power_modes]
initial = false
bdot = false
rough_sun_pointing = false
rough_three_axis_mtq = false
rough_three_axis_rw = false
fine_three_axis = false
imaging = true
xband_downlink = false

[image_sensors.rsi_tdi.meta]
notes = "TSRI 製 CMOS-TDI。EU_ON=11.8W/FPA_ON=17.1W/SENSOR_ON=18.7W [rsi.ini]。PCDU MISSION_1=11.51W。TDI SNR ∝ √8 ≈ 2.83× vs 単段"



# === MissionInterface (MIF 基板, ISSL / Xilinx Zynq-7020) ===
#
# ISSL 製、SPHERE-1 EYE 共通設計。Zynq-7020 (ARM+FPGA)。
# PCDU チャネル MISSION_IF = 2.10 W [確定値: Power Overview §5]
# 質量 77.05 g [確定値: 宇科連2023]

[mission_interfaces.spec]
mass_kg = 0.07705                 # [確定値: 宇科連2023 MIF 基板 77.05 g]
power_per_unit_w = 2.10           # [確定値: PCDU MISSION_IF = 2.10 W（Power Overview §5）]
soc = "Xilinx Zynq-7020"
interface_type = "RS422"
ccsds_packet_protocol = "CCSDS Space Packet Protocol Blue Book 2020"
manufacturer = "ISSL"

[mission_interfaces.mif.design]
quantity = 1

[mission_interfaces.mif.design.placement]
face = "MY"
u = 0.0
v = 0.0
w = 0.0
dx = 90.0                         # [推測] PC-104 互換ボード相当
dy = 96.0                         # [推測]
dz = 20.0                         # [推測]
rz = 0.0
side = "IN"
cad_file = ""
cad_offset_x = 0.0
cad_offset_y = 0.0
cad_offset_z = 0.0
update_bbox = 0

[mission_interfaces.mif.design.power_modes]
initial = false
bdot = false
rough_sun_pointing = false
rough_three_axis_mtq = false
rough_three_axis_rw = false
fine_three_axis = false
imaging = true
xband_downlink = false

[mission_interfaces.mif.meta]
notes = "MIF（Mission Interface board）。RS422 port3=MIS_IF, port4=RSI。CCSDS パケット変換 → XTx。XTx 不調時は STx バックアップ。SEE 試験 2021/9, TID 試験 2022/4 [宇科連2023]"



# === ImageProcessor (オンボード画像処理・MOBC 機能コンポ) ===
#
# MOBC 上の画像処理・圧縮ソフトウェアを機能コンポとして記述。
# PCDU チャネル MISSION_2 = 8.14 W [確定値: Power Overview §5]（推測: FPA/センサ系分）

[image_processors.spec]
mass_kg = 0.0                     # ソフトウェア機能コンポ（MOBC ハードウェアに含まれる）
power_per_unit_w = 8.14           # [確定値: PCDU MISSION_2 = 8.14 W（Power Overview §5）]
compression_algorithm = "CCSDS-IDC/JPEG2000 (推測)"
frames_per_mission = 10           # [確定値: S2E telescope.ini number_of_frames_per_mission = 10]
processing_host = "MOBC"

[image_processors.mobc_imaging.design]
quantity = 1
compression_ratio = 4.0           # [推測] 数分の1〜十数分の1（実機仕様非公開）

[image_processors.mobc_imaging.design.placement]
face = "MY"
u = 0.0
v = 0.0
w = 0.0
dx = 0.0
dy = 0.0
dz = 0.0
rz = 0.0
side = "IN"
cad_file = ""
cad_offset_x = 0.0
cad_offset_y = 0.0
cad_offset_z = 0.0
update_bbox = 0

[image_processors.mobc_imaging.design.power_modes]
initial = false
bdot = false
rough_sun_pointing = false
rough_three_axis_mtq = false
rough_three_axis_rw = false
fine_three_axis = false
imaging = true
xband_downlink = false

[image_processors.mobc_imaging.meta]
notes = "MOBC 上の画像処理・圧縮機能。生データ概算: 8192×8192×10bit×10frames ≈ 840MB。圧縮方式非公開（推測: CCSDS-IDC/JPEG2000）"
