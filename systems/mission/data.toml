# Mission system — Config + Payload コンポーネント
#
# Source: ONGLAISAT（6U 地球観測 CubeSat, TASA × ISSL 東大 × ArkEdge）
#   - S2E telescope.ini / rsi.ini / mission_if.ini（S2E シミュレータ設定、確定値）
#   - 宇科連2023（Tsutsui ほか、ISSL 宇宙科学技術連合講演会論文）
#   - PCDU チャネル情報（Power Overview §5）
#   - 質量シート mass_inertia_breakdown.csv「4.Mission」
#
# (Worktree: agent-a8d9ed8d9edc3b73e)
# Source (Config/OperationMode): SEIRIOS 子衛星 (shared drive: SEIRIOS)
#   - 電源モード検討 / サマリ
#   - SEIRIOS_コンポ管理シート / 子衛星1
#   - SEIRIOS_ブロック図



# === Mission Profile ===

[missionprofile]
duration_years = 1.0 # SEIRIOS フルサクセス期間（TBD）
target_altitude_km = 600.0 # 想定 LEO 高度（蝕計算と整合）
primary_payload = "formation_flying" # 主ペイロード: 編隊飛行制御
contact_frequency_per_day = 4 # 1 日あたりの地上局可視回数（S 帯）
launch_window_start = "2027-01-01T00:00:00Z" # 打ち上げ窓開始 (TBD)



# === Orbital Parameters ===

[orbitalparameters]
semi_major_axis_km = 6978.137 # Re + 600 km
eccentricity = 0.001
inclination_deg = 51.6 # ISS 軌道想定（編隊飛行）
raan_deg = 45.0
arg_periapsis_deg = 0.0
mean_anomaly_deg = 0.0
epoch_utc = "2027-01-01T00:00:00Z"



# === Operation Mode Config ===
#
# Source: SEIRIOS 子衛星 電源モード検討 / 子衛星電力消費 シート
#   各モードの消費電力 [W] とマージン込み [W] は description に記載。

# --- 子衛星単独運用 ---

[operation_mode_configs.safe]
description = "セーフモード（姿勢制御無し）。子衛星単独 4.9W、margin 5.3W、発電 9.5W。蝕中はヒーターON で 6.9W/7.4W、発電 7.4W"
max_duration_s = 0.0
is_initial_mode = true
allowed_transitions = ["sun_acquisition", "coarse_3axis"]

[operation_mode_configs.sun_acquisition]
description = "太陽捕捉モード。SAP を太陽方向に向ける。消費 7.0W、Tx ON 時 14.0W"
max_duration_s = 0.0
is_initial_mode = false
allowed_transitions = ["safe", "coarse_3axis", "fine_3axis"]

[operation_mode_configs.coarse_3axis]
description = "粗三軸モード（RW + 粗ジャイロ）。消費 9.4W、Tx ON 時 16.4W"
max_duration_s = 0.0
is_initial_mode = false
allowed_transitions = ["safe", "sun_acquisition", "fine_3axis", "propulsion"]

[operation_mode_configs.fine_3axis]
description = "精三軸モード（STT + RW + 精ジャイロ）。消費 10.9W、Tx ON 時 17.9W"
max_duration_s = 0.0
is_initial_mode = false
allowed_transitions = ["safe", "coarse_3axis", "propulsion", "coarse_ff", "fine_ff"]

[operation_mode_configs.propulsion]
description = "推進系運用モード（FF 制御推進機 ON）。消費 32.2W、Tx ON 時 39.2W。インパルス的動作"
max_duration_s = 600.0
is_initial_mode = false
allowed_transitions = ["fine_3axis", "coarse_ff", "fine_ff"]

# --- 合体時 (mated) ---

[operation_mode_configs.mated_check]
description = "合体時、子衛星の動作確認。消費 4.9W"
max_duration_s = 0.0
is_initial_mode = false
allowed_transitions = ["mated_calibration", "mated_actuator", "safe"]

[operation_mode_configs.mated_calibration]
description = "合体時キャリブレーション。消費 9.9W"
max_duration_s = 3600.0
is_initial_mode = false
allowed_transitions = ["mated_check", "mated_actuator"]

[operation_mode_configs.mated_actuator]
description = "合体時アクチュエータ動作試験。消費 32.7W"
max_duration_s = 3600.0
is_initial_mode = false
allowed_transitions = ["mated_check", "mated_calibration"]

# --- FF 運用 (Formation Flying) ---

[operation_mode_configs.coarse_ff]
description = "粗 FF（CDGNSS 主体）。消費 12.6W、Tx ON 時 19.6W、推進系 ON 時 32.6W"
max_duration_s = 0.0
is_initial_mode = false
allowed_transitions = ["fine_3axis", "fine_ff", "propulsion"]

[operation_mode_configs.fine_ff]
description = "精 FF（光学航法 + レーザー距離計）。消費 13.6W、推進系 ON 時 33.6W。発電 16.1W、蝕中は margin -1.2%"
max_duration_s = 0.0
is_initial_mode = false
allowed_transitions = ["coarse_ff", "propulsion"]



# ============================================================
# === Payload Components (ONGLAISAT Mission Payload) ===
# ============================================================
#
# Source: S2E telescope.ini / rsi.ini / mission_if.ini
#         宇科連2023（Tsutsui ほか）/ PCDU チャネル情報（Power Overview §5）
#         質量シート mass_inertia_breakdown.csv「4.Mission」
#
# 撮像チェーン: 地表シーン → Korsch 光学系 → TDI センサ → RSI/FPA →
#   Mission IF → MOBC（画像処理・圧縮）→ XTx → 地上局



# === Telescope (RSI — Korsch オフアクシス光学系) ===
#
# TASA 製 Korsch 型オフアクシス 3 枚鏡系。受動系（電力消費なし）。
# LoS = コンポーネント +X 軸（telescope.ini quaternion_b2c）。
# 質量: カメラアセンブリ 699.61 g（不完全フラグ、CCC/内部/レンズ未計上）
#       光学系単体は未分離 → 推測 TBD [推測]

[telescope.spec]
mass_kg = 0.5                     # [推測] カメラアセンブリ 699.61g の一部（光学系単体未分離）
focal_length_m = 0.725            # [確定値: S2E telescope.ini focal_length_m = 0.725]
aperture_diameter_m = 0.145       # [推測] f/5 仮定 → Ø145 mm（実機 TASA 非公開）
f_number = 5.0                    # [推測] D=Ø145 mm / f=725 mm = f/5
pixel_size_m = 5.0e-6             # [確定値: S2E telescope.ini pixel_size_m = 5.0e-6 m]
ifov_rad = 6.897e-6               # [確定値] pixel_size_m / focal_length_m = 5e-6 / 0.725
sun_exclusion_angle_deg = 60.0    # [確定値: S2E telescope.ini sun_exclusion_angle_deg = 60]
earth_exclusion_angle_deg = 60.0  # [確定値: S2E telescope.ini earth_exclusion_angle_deg = 60]
moon_exclusion_angle_deg = 60.0   # [確定値: S2E telescope.ini moon_exclusion_angle_deg = 60]
telescope_type = "Korsch off-axis"
manufacturer = "TASA"

[telescope.design]
quantity = 1                      # RSI × 1 台

[telescope.design.placement]
face = "PX"                       # LoS = +X（telescope.ini quaternion_b2c から）
u = 0.0
v = 0.0
w = 0.0
dx = 100.0                        # [TBD] 6U 短辺 100 mm
dy = 100.0                        # [TBD]
dz = 340.0                        # [TBD] 6U 長辺 340 mm（折返し光路）
rz = 0.0
side = "IN"
cad_file = ""
cad_offset_x = 0.0
cad_offset_y = 0.0
cad_offset_z = 0.0
update_bbox = 0

[telescope.meta]
notes = "RSI（Remote Sensing Instrument）= ミッション望遠鏡の正式名称 [宇科連2023]。Korsch 3 枚鏡系、f=725mm、pixel=5μm。質量はカメラアセンブリ 699.61g から推測（光学系単体未分離）"



# === ImageSensor (CMOS-TDI ラインセンサ, TSRI) ===
#
# TSRI 製 CMOS-TDI ラインセンサ。32×8192 px、TDI 8 段。
# PCDU チャネル MISSION_1 = 11.51 W [確定値: Power Overview §5]

[image_sensors.spec]
mass_kg = 0.1                     # [推測] センサ + FPA 単体質量（カメラアセンブリから未分離）
temp_min_c = -20.0                # [推測] CMOS TDI 典型動作温度下限
temp_max_c = 60.0                 # [推測] CMOS TDI 典型動作温度上限
power_per_unit_w = 11.51          # [確定値: PCDU MISSION_1 = 11.51 W（Power Overview §5）]
x_pixels = 32                    # [確定値: S2E telescope.ini x_number_of_pixel = 32（TDI 段方向）]
y_pixels = 8192                  # [確定値: S2E telescope.ini y_number_of_pixel = 8192（クロストラック）]
pixel_size_m = 5.0e-6             # [確定値: S2E telescope.ini pixel_size_m = 5.0e-6 m]
tdi_stages = 8                    # [確定値: S2E telescope.ini stage_mode = 8]
tdi_max_stages = 32               # [確定値: 物理配列 X 方向 = 32 段]
line_rate_s = 0.000423            # [確定値: TDI-analysis 最適化値 line_rate = 0.000423 s]
lines_per_frame = 378             # [確定値: TDI-analysis 1 フレーム = 378 ライン]
frames_per_mission = 10           # [確定値: S2E telescope.ini number_of_frames_per_mission = 10]
sensor_type = "CMOS TDI"
manufacturer = "TSRI"

[image_sensors.rsi_tdi.design]
quantity = 1
bits_per_pixel = 10               # [推測] 10–12 bit 典型

[image_sensors.rsi_tdi.design.placement]
face = "PX"
u = 0.0
v = 0.0
w = 0.0
dx = 50.0                         # [TBD] FPA アセンブリ寸法
dy = 50.0                         # [TBD]
dz = 30.0                         # [TBD]
rz = 0.0
side = "IN"
cad_file = ""
cad_offset_x = 0.0
cad_offset_y = 0.0
cad_offset_z = 0.0
update_bbox = 0

[image_sensors.rsi_tdi.design.power_modes]
safe = false
sun_acquisition = false
coarse_3axis = false
fine_3axis = false
propulsion = false
mated_check = false
mated_calibration = false
mated_actuator = false
coarse_ff = false
fine_ff = false

[image_sensors.rsi_tdi.meta]
notes = "TSRI 製 CMOS-TDI。EU_ON=11.8W/FPA_ON=17.1W/SENSOR_ON=18.7W [rsi.ini]。PCDU MISSION_1=11.51W。TDI SNR ∝ √8 ≈ 2.83× vs 単段"



# === MissionInterface (MIF 基板, ISSL / Xilinx Zynq-7020) ===
#
# ISSL 製、SPHERE-1 EYE 共通設計。Zynq-7020 (ARM+FPGA)。
# PCDU チャネル MISSION_IF = 2.10 W [確定値: Power Overview §5]
# 質量 77.05 g [確定値: 宇科連2023]

[mission_interfaces.spec]
mass_kg = 0.07705                 # [確定値: 宇科連2023 MIF 基板 77.05 g]
power_per_unit_w = 2.10           # [確定値: PCDU MISSION_IF = 2.10 W（Power Overview §5）]
soc = "Xilinx Zynq-7020"
interface_type = "RS422"
ccsds_packet_protocol = "CCSDS Space Packet Protocol Blue Book 2020"
manufacturer = "ISSL"

[mission_interfaces.mif.design]
quantity = 1

[mission_interfaces.mif.design.placement]
face = "MY"
u = 0.0
v = 0.0
w = 0.0
dx = 90.0                         # [推測] PC-104 互換ボード相当
dy = 96.0                         # [推測]
dz = 20.0                         # [推測]
rz = 0.0
side = "IN"
cad_file = ""
cad_offset_x = 0.0
cad_offset_y = 0.0
cad_offset_z = 0.0
update_bbox = 0

[mission_interfaces.mif.design.power_modes]
safe = false
sun_acquisition = false
coarse_3axis = false
fine_3axis = false
propulsion = false
mated_check = false
mated_calibration = false
mated_actuator = false
coarse_ff = false
fine_ff = false

[mission_interfaces.mif.meta]
notes = "MIF（Mission Interface board）。RS422 port3=MIS_IF, port4=RSI。CCSDS パケット変換 → XTx。XTx 不調時は STx バックアップ。SEE 試験 2021/9, TID 試験 2022/4 [宇科連2023]"



# === ImageProcessor (オンボード画像処理・MOBC 機能コンポ) ===
#
# MOBC 上の画像処理・圧縮ソフトウェアを機能コンポとして記述。
# PCDU チャネル MISSION_2 = 8.14 W [確定値: Power Overview §5]（推測: FPA/センサ系分）

[image_processors.spec]
mass_kg = 0.0                     # ソフトウェア機能コンポ（MOBC ハードウェアに含まれる）
power_per_unit_w = 8.14           # [確定値: PCDU MISSION_2 = 8.14 W（Power Overview §5）]
compression_algorithm = "CCSDS-IDC/JPEG2000 (推測)"
frames_per_mission = 10           # [確定値: S2E telescope.ini number_of_frames_per_mission = 10]
processing_host = "MOBC"

[image_processors.mobc_imaging.design]
quantity = 1
compression_ratio = 4.0           # [推測] 数分の1〜十数分の1（実機仕様非公開）

[image_processors.mobc_imaging.design.placement]
face = "MY"
u = 0.0
v = 0.0
w = 0.0
dx = 0.0
dy = 0.0
dz = 0.0
rz = 0.0
side = "IN"
cad_file = ""
cad_offset_x = 0.0
cad_offset_y = 0.0
cad_offset_z = 0.0
update_bbox = 0

[image_processors.mobc_imaging.design.power_modes]
safe = false
sun_acquisition = false
coarse_3axis = false
fine_3axis = false
propulsion = false
mated_check = false
mated_calibration = false
mated_actuator = false
coarse_ff = false
fine_ff = false

[image_processors.mobc_imaging.meta]
notes = "MOBC 上の画像処理・圧縮機能。生データ概算: 8192×8192×10bit×10frames ≈ 840MB。圧縮方式非公開（推測: CCSDS-IDC/JPEG2000）"
