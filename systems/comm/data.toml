# Comm system instance data
#
# Source: ONGLAISAT（6U 地球観測 CubeSat）通信系
#   - 04_Communication/*.md（Comm Overview / SRx / STx / XTx / LoRa / Antennas / Ground Station）
#   - [S2E] s2e-mobc-settings/satellite/components/comm/{srx,stx,xtx}.ini
#   - [S2E] s2e-mobc-settings/ground_station/components/ground_station_{sup,sdown,xdown}.ini
#   - 質量: mass_inertia_breakdown.csv「2.communication」



# === Transceiver: SRx (S-band uplink command receiver) ===
# [S2E] srx.ini: 2104.7 MHz, 4 kbps, rx gain 4.5 dBi, Tsys 881.05 K。
# [確定値] PCDU 消費電力 0.81 W。STRx は STx と一体のため主質量は STx 側に計上。

[transceivers.srx.spec]
mass_kg = 0.0 # TBD: STRx 265.96 g は stx に一括計上（二重計上回避）
temp_min_c = -20.0 # [推定] Addnics 小型 S-band 機器の一般動作範囲
temp_max_c = 60.0 # [推定]
power_per_unit_w = 0.81 # [確定値] PCDU SRx channel [W]
band = "s_band"
direction = "rx"
frequency_mhz = 2104.7 # [S2E] srx.ini frequency_MHz
tx_power_w = 0.0 # [S2E] 受信専用
data_rate_kbps = 4.0 # [S2E] tx_bitrate_bps = 4000（上り受信レート）
s2e_data_rate_kbps = 4.0
max_data_rate_kbps = 4.0 # [JESA論文] 1/4 kbps 対応の上限
modulation = "QPSK" # [S2E] GS calculator required Eb/N0 注記。TBD: 実変調設定確認
tx_gain_dbi = 0.0
rx_gain_dbi = 4.5 # [S2E] srx.ini rx_gain_dBi
tx_loss_feeder_db = 0.0
tx_loss_pointing_db = 0.0
rx_loss_feeder_db = -3.0 # [S2E] srx.ini rx_loss_feeder_dB
rx_loss_pointing_db = 0.0 # [S2E]
rx_system_noise_temperature_k = 881.05 # [S2E]
ground_tx_power_w = 20.0 # [S2E] ground_station_sup.ini tx_output_W
ground_tx_gain_dbi = 34.0 # [S2E] ground_station_sup.ini tx_gain_dBi
ground_rx_gain_dbi = 0.0
ground_loss_feeder_db = -3.01 # [S2E] ground_station_sup.ini tx_loss_feeder_dB
ground_loss_pointing_db = 0.0 # [S2E]
ground_rx_system_noise_temperature_k = 0.0
atmospheric_loss_db = -0.5 # [S2E] GS calculator
rainfall_loss_db = -0.61 # [S2E]
polarization_loss_db = 0.0 # [S2E]
other_loss_db = 0.0 # [S2E]
required_ebn0_db = 22.03 # [S2E] BER 1e-6
hardware_deterioration_db = 1.5 # [S2E]
coding_gain_db = -8.17 # [S2E] RS(E16)+Convolution gain
margin_requirement_db = 3.0 # [S2E]
pass_duration_s = 600.0 # [推定] ISS 410 km 級の可視パス代表値
link_efficiency = 0.9 # [推定] toolbox comm.data 既定値

[transceivers.srx.design]
quantity = 1 # 搭載個数

[transceivers.srx.design.placement] # 搭載位置・CAD パラメータ
face = "MZ" # Panel face to mount on
u = 0.0 # Position along face u-axis [mm]
v = 0.0 # Position along face v-axis [mm]
w = 0.0 # Offset from face surface [mm]
dx = 80.0 # Bounding box x dimension [mm]
dy = 80.0 # Bounding box y dimension [mm]
dz = 16.0 # Bounding box z dimension [mm]
rz = 0.0 # Rotation around face normal [degrees]
side = "IN" # Mount on inner or outer face
cad_file = "" # CAD document name (empty = generate box)
cad_offset_x = 0.0 # CAD bounding box center offset x [mm]
cad_offset_y = 0.0 # CAD bounding box center offset y [mm]
cad_offset_z = 0.0 # CAD bounding box center offset z [mm]
update_bbox = 0 # Set to 1 to auto-update bbox from CAD

[transceivers.srx.design.power_modes] # OperationMode 別の on/off
initial = true
bdot = true
rough_sun_pointing = true
rough_three_axis_mtq = true
rough_three_axis_rw = true
fine_three_axis = true
imaging = true
xband_downlink = true

[transceivers.srx.meta]
notes = "常時コマンド受信。STRx は STx と筐体共有、質量は stx に一括計上"



# === Transceiver: STx (S-band telemetry downlink transmitter) ===
# [S2E] stx.ini: 2277.3 MHz, 64 kbps, RF 0.28 W, tx gain 4.5 dBi。
# [確定値] PCDU 消費電力 6.28 W。STRx 265.96 g はここに一括計上。


[transceivers.stx.spec]
mass_kg = 0.26596 # [S2E] mass_inertia_breakdown.csv STRx
temp_min_c = -20.0 # [推定]
temp_max_c = 60.0 # [推定]
power_per_unit_w = 6.28 # [確定値] PCDU STx channel [W]
band = "s_band"
direction = "tx"
frequency_mhz = 2277.3 # [S2E] stx.ini frequency_MHz
tx_power_w = 0.28 # [S2E] stx.ini tx_output_W
data_rate_kbps = 64.0 # [S2E] tx_bitrate_bps = 64000
s2e_data_rate_kbps = 64.0
max_data_rate_kbps = 100.0 # [JESA論文] 10-100 kbps
modulation = "QPSK" # [S2E] GS calculator required Eb/N0 注記
tx_gain_dbi = 4.5 # [S2E] stx.ini tx_gain_dBi
rx_gain_dbi = 0.0
tx_loss_feeder_db = -3.0 # [S2E] stx.ini tx_loss_feeder_dB
tx_loss_pointing_db = 0.0 # [S2E]
rx_loss_feeder_db = 0.0
rx_loss_pointing_db = 0.0
rx_system_noise_temperature_k = 0.0
ground_tx_power_w = 0.0
ground_tx_gain_dbi = 0.0
ground_rx_gain_dbi = 43.0 # [S2E] ground_station_sdown.ini rx_gain_dBi
ground_loss_feeder_db = 0.0 # [S2E] ground_station_sdown.ini rx_loss_feeder_dB
ground_loss_pointing_db = 0.0 # [S2E]
ground_rx_system_noise_temperature_k = 1000.0 # [S2E]
atmospheric_loss_db = -0.5 # [S2E] GS calculator
rainfall_loss_db = -0.61 # [S2E]
polarization_loss_db = 0.0 # [S2E]
other_loss_db = 0.0 # [S2E]
required_ebn0_db = 10.8 # [S2E] BER 1e-6
hardware_deterioration_db = 1.5 # [S2E]
coding_gain_db = -8.17 # [S2E]
margin_requirement_db = 3.0 # [S2E]
pass_duration_s = 600.0 # [推定]
link_efficiency = 0.9 # [推定]

[transceivers.stx.design]
quantity = 1 # 搭載個数

[transceivers.stx.design.placement] # 搭載位置・CAD パラメータ
face = "MZ" # Panel face to mount on
u = 0.0 # Position along face u-axis [mm]
v = 0.0 # Position along face v-axis [mm]
w = 0.0 # Offset from face surface [mm]
dx = 80.0 # Bounding box x dimension [mm]
dy = 80.0 # Bounding box y dimension [mm]
dz = 15.0 # Bounding box z dimension [mm]
rz = 0.0 # Rotation around face normal [degrees]
side = "IN" # Mount on inner or outer face
cad_file = "" # CAD document name (empty = generate box)
cad_offset_x = 0.0 # CAD bounding box center offset x [mm]
cad_offset_y = 0.0 # CAD bounding box center offset y [mm]
cad_offset_z = 0.0 # CAD bounding box center offset z [mm]
update_bbox = 0 # Set to 1 to auto-update bbox from CAD

[transceivers.stx.design.power_modes] # OperationMode 別の on/off
# STx = S帯テレメトリ下り（64kbps HK）。地上局接触時のみ送信する。
#   - fine_three_axis: 定常 S帯 TT&C パスで HK 下り → ON
#   - xband_downlink:  X帯 GS パス中に S帯 HK を併用 + XTx バックアップ → ON
#   - imaging:         撮像は対象上空（GS 非接触）でデータは蓄積、下りは後続パス → OFF
# 出典契約: Power Overview §5 は撮像時に S帯下りを含めない（撮像 ~29.5W）。
initial = false
bdot = false
rough_sun_pointing = false
rough_three_axis_mtq = false
rough_three_axis_rw = false
fine_three_axis = true
imaging = false
xband_downlink = true

[transceivers.stx.meta]
notes = "地上局可視時の HK/TLM 送信。STRx 一体質量 265.96 g を代表計上"



