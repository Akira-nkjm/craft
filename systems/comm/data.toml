linked_transceiver = "lora"
radiation_pattern = "" # [S2E対象外]

[antennas.lora_patch.design]
quantity = 1 # 搭載個数

[antennas.lora_patch.design.placement] # 搭載位置・CAD パラメータ
face = "MZ" # Panel face to mount on
u = 0.0 # Position along face u-axis [mm]
v = 0.0 # Position along face v-axis [mm]
w = 0.0 # Offset from face surface [mm]
dx = 82.0 # Bounding box x dimension [mm]
dy = 82.0 # Bounding box y dimension [mm]
dz = 3.2 # Bounding box z dimension [mm]
rz = 0.0 # Rotation around face normal [degrees]
side = "OUT" # Mount on inner or outer face
cad_file = "" # CAD document name (empty = generate box)
cad_offset_x = 0.0 # CAD bounding box center offset x [mm]
cad_offset_y = 0.0 # CAD bounding box center offset y [mm]
cad_offset_z = 0.0 # CAD bounding box center offset z [mm]
update_bbox = 0 # Set to 1 to auto-update bbox from CAD

[antennas.spec]
mass_kg = 0.0 # 質量 [kg]
band = "" # 対応周波数帯: s_band / lora / bluetooth 等
gain_dbi = 0.0 # アンテナ利得 [dBi]
polarization = "LHCP" # 偏波: LHCP / RHCP / Linear
direction = "tx_rx" # tx / rx / tx_rx
linked_transceiver = "" # 対応 Transceiver インスタンス名
radiation_pattern = "" # 放射パターン CSV 等
