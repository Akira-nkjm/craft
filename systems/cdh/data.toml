# C&DH system instance data
#
# Source: ONGLAISAT C&DH
#   - 01_CDH/CDH Overview.md, MOBC.md, AOBC.md, TOBC.md
#   - 01_CDH/Data Buses and Ports.md
#   - [S2E] s2e-mobc-settings/satellite/components/{cdh,thermal}/*.ini
#   - 質量: mass_inertia_breakdown.csv「3.CDH」



# === OBC: MOBC (Main OBC) ===
# [確定値] SH-2A 200MHz, 128KiB internal RAM + 8MiB SRAM, 2MiB MRAM, 2GiB NAND.
# [S2E] mass_inertia_breakdown.csv: MOBC board1&2 (OBC) 145.98g.
# [確定値] PCDU ch0: 1.89W, all 8 operation modes ON.

[obcs.mobc.spec]
mass_kg = 0.14598 # 質量 [kg]
temp_min_c = -20.0 # [推定] 動作温度下限 [degC] TBD: board-level qualified range
temp_max_c = 60.0 # [推定] 動作温度上限 [degC] TBD: board-level qualified range
power_per_unit_w = 1.89 # PCDU MOBC ch0 想定消費 [W]
processor = "Renesas Electronics SH-2A"
clock_mhz = 200
ram_kb = 8320 # 128KiB internal + 8MiB external SRAM
rom_kb = 2560 # 2.5MiB internal ROM
nvm_kb = 2048 # 2MiB MRAM
storage_gb = 2.0 # NAND flash
architecture = "SH-2A / ArkEdge YODAKA-AE1b heritage"
role = "bus master, command distribution, telemetry aggregation, downlink, time, FDIR"
primary_bus = "MOBC UART master: RS-422/LVTTL"
nominal_packet_rate_hz = 4.0 # [推定] MOBC aggregated HK cadence
nominal_packet_size_bits = 4096.0 # [推定] aggregated HK packet size

[obcs.mobc.design]
quantity = 1 # 搭載個数
firmware_version = "c2a-mobc-onglaisat"
boot_partition_count = 1
estimated_wcet_s = 0.08 # 主要周期処理の概算 WCET [s]
control_period_s = 1.0 # 主要周期処理の周期 [s]

[obcs.mobc.design.placement] # 搭載位置・CAD パラメータ
face = "MY" # Panel face to mount on
u = 0.0 # [S2E] CG x=-44.2mm; Placement u is constrained non-negative
v = 62.4 # Position along face v-axis [mm]
w = 0.0 # [S2E] CG z=-0.25mm; Placement w is constrained non-negative
dx = 90.0 # Bounding box x dimension [mm]
dy = 90.0 # Bounding box y dimension [mm]
dz = 15.0 # Bounding box z dimension [mm]
rz = 0.0 # Rotation around face normal [degrees]
side = "IN" # Mount on inner or outer face
cad_file = "" # CAD document name (empty = generate box)
cad_offset_x = 0.0 # CAD bounding box center offset x [mm]
cad_offset_y = 0.0 # CAD bounding box center offset y [mm]
cad_offset_z = 0.0 # CAD bounding box center offset z [mm]
update_bbox = 0 # Set to 1 to auto-update bbox from CAD

[obcs.mobc.design.power_modes] # OperationMode 別の on/off
initial = true
bdot = true
rough_sun_pointing = true
rough_three_axis_mtq = true
rough_three_axis_rw = true
fine_three_axis = true
imaging = true
xband_downlink = true

[obcs.mobc.requirements]
mtbf_hours = 50000.0 # [h]
radiation_tolerance_krad = 20.0 # [krad]
max_cpu_utilization = 0.7 # 許容 CPU 占有率
max_no_contact_days = 3.0 # オンボード保存を要求する最大無通信日数 [d]

[obcs.mobc.meta]
notes = "MOBC board1&2。Data source: MOBC.md / CDH Overview.md / mass_inertia_breakdown.csv"



# === OBC: AOBC (AOCS OBC) ===
# [確定値] PIC32MX7 80MHz, 128KiB RAM, 512KiB ROM, 512KiB FRAM.
# 質量の所有境界: CSV「5.AOCS」の AOBC all-assy 1124.29g は RW×3/MTQ×3/STT/gyro/
#   磁気センサ/GNSS-rx（= aocs system で個別計上、計 723g）を内包する。二重計上を避け、
#   ここでは AOBC 基板＋AOCS モジュール統合構造のみ（all-assy 1124.29 − 723 = 401.3g）を計上。
#   → cdh(AOBC 401.3g) + aocs(機器 786.9g) = CSV 5.AOCS 合計 1188.14g に一致。
# [確定値] PCDU ch1 AOBC_5V 1.94W + ch2 AOBC_BUS 3.56W = 5.50W, all 8 operation modes ON.


[obcs.aobc.spec]
mass_kg = 0.40129 # AOBC 基板＋AOCS モジュール統合構造（all-assy 1124.29g − aocs 個別計上 723g）
temp_min_c = -20.0 # [推定] 動作温度下限 [degC] TBD
temp_max_c = 60.0 # [推定] 動作温度上限 [degC] TBD
power_per_unit_w = 5.50 # AOBC_5V + AOBC_BUS [W]
processor = "Microchip PIC32MX7"
clock_mhz = 80
ram_kb = 128
rom_kb = 512
nvm_kb = 512 # FRAM
storage_gb = 0.0
architecture = "PIC32MX7 / C2A-AOBC"
role = "AOCS attitude determination and control"
primary_bus = "MOBC port 8 LVTTL UART; local I2C/SPI/GPIO/ADC"
nominal_packet_rate_hz = 8.0 # [推定] AOCS HK/control telemetry cadence
nominal_packet_size_bits = 2048.0 # [推定]

[obcs.aobc.design]
quantity = 1 # 搭載個数
firmware_version = "c2a-aobc-onglaisat v1.1.1 sync"
boot_partition_count = 1
estimated_wcet_s = 0.12 # 主要周期処理の概算 WCET [s]
control_period_s = 1.0 # 主要周期処理の周期 [s]

[obcs.aobc.design.placement] # 搭載位置・CAD パラメータ
face = "MY" # Panel face to mount on
u = 0.0 # Position along face u-axis [mm]
v = 0.0 # Position along face v-axis [mm]
w = 0.0 # Offset from face surface [mm]
dx = 95.0 # Bounding box x dimension [mm]
dy = 95.0 # Bounding box y dimension [mm]
dz = 45.0 # Bounding box z dimension [mm]
rz = 0.0 # Rotation around face normal [degrees]
side = "IN" # Mount on inner or outer face
cad_file = "" # CAD document name (empty = generate box)
cad_offset_x = 0.0 # CAD bounding box center offset x [mm]
cad_offset_y = 0.0 # CAD bounding box center offset y [mm]
cad_offset_z = 0.0 # CAD bounding box center offset z [mm]
update_bbox = 0 # Set to 1 to auto-update bbox from CAD

[obcs.aobc.design.power_modes] # OperationMode 別の on/off
initial = true
bdot = true
rough_sun_pointing = true
rough_three_axis_mtq = true
rough_three_axis_rw = true
fine_three_axis = true
imaging = true
xband_downlink = true

[obcs.aobc.requirements]
mtbf_hours = 50000.0 # [h]
radiation_tolerance_krad = 20.0 # [krad]
max_cpu_utilization = 0.75 # 許容 CPU 占有率
max_no_contact_days = 3.0 # オンボード保存を要求する最大無通信日数 [d]

[obcs.aobc.meta]
notes = "AOBC board-only mass is TBD; current value is S2E AOCS module all-assy mass."



