# === Star Tracker (Sagitta × 1) ===
# [確定値] Sagitta: 270 g, 1.0 W
# [S2E] sagitta.ini — 視軸直交 ≈ 2 arcsec (3σ), 5 Hz, 太陽排他 40 deg

[star_trackers.spec]
mass_kg = 0.270               # [確定値] Sagitta datasheet 270 g
temp_min_c = -30.0
temp_max_c = 50.0
power_per_unit_w = 1.0        # [S2E] sagitta.ini 1.0 W
accuracy_arcsec = 2.0         # [S2E] 視軸直交ノイズ 9.6963e-6 rad ≈ 2 arcsec (3σ)
fov_deg = 12.7                # [推定] Sagitta FOV 半角 12.7 deg [TBD]
update_rate_hz = 5.0          # [S2E] output_interval = 0.2 s → 5 Hz
sun_exclusion_deg = 40.0      # [S2E] sagitta.ini sun_exclusion = 40 deg
earth_exclusion_deg = 30.0    # [S2E] sagitta.ini earth_exclusion = 30 deg

[star_trackers.main.design]
quantity = 1

[star_trackers.main.design.placement]
face = "MY"
u = 0.0
v = 0.0
w = 0.0
dx = 95.0
dy = 50.0
dz = 44.0
rz = 0.0
side = "OUT"
cad_file = ""
cad_offset_x = 0.0
cad_offset_y = 0.0
cad_offset_z = 0.0
update_bbox = 0

[star_trackers.main.design.power_modes]
initial = false
bdot = false
rough_sun_pointing = false
rough_three_axis_mtq = false
rough_three_axis_rw = false
fine_three_axis = true
imaging = true
xband_downlink = true



