# AOCS system instance data — ONGLAISAT (6U 地球観測 CubeSat)
#
# Source: ONGLAISAT AOCS
#   - S2E ini: 99_Sources/raw/s2e-aobc-initialize_files/components/
#   - 質量表: 99_Sources/raw/mass_inertia_breakdown.csv (「5.AOCS」行)
#   - MD: 02_AOCS/*.md
#
# 運用モード (8 mode): initial / bdot / rough_sun_pointing / rough_three_axis_mtq /
#                      rough_three_axis_rw / fine_three_axis / imaging / xband_downlink



# === Disturbance Model（外乱解析モデルパラメータ）===
# 高度は orbital.altitude_km、慣性は mission.massproperties を参照。ここは機体固有の
# 空力・指向モデル値（[推定] 含む）の single source。

[disturbancemodel]
reference_area_m2 = 0.02 # 空力基準面積（6U 側面 ≈ 0.02 m²）[推定] [m^2]
drag_coefficient = 2.2 # 抗力係数（CubeSat 標準値）
cp_cg_offset_m = 0.05 # 圧力中心-重心オフセット [推定] [m]
atmospheric_density_kg_m3 = 3.0e-11 # 軌道高度の大気密度（NRLMSISE-00 中活動期）[推定] [kg/m^3]
pointing_error_deg = 5.0 # 重力傾斜評価用 worst-case 指向誤差 [deg]
momentum_margin = 0.2 # RW 飽和/MTQ desat 判定のマージン率



# === Sun Senser ===

[sun_sensers.spec]
mass_kg = 0.0067 # 質量 [kg]
power_per_unit_w = 0.07 # 単位あたりの想定消費電力 [W]
fov_deg = 60.0 # 視野角（半角） [deg]

[sun_sensers.main.design]
quantity = 4 # 搭載個数

[sun_sensers.main.design.placement] # 搭載位置・CAD パラメータ
face = "PY" # Panel face to mount on
u = 0.0 # Position along face u-axis [mm]
v = 0.0 # Position along face v-axis [mm]
w = 0.0 # Offset from face surface [mm]
dx = 27.0 # Bounding box x dimension [mm]
dy = 14.0 # Bounding box y dimension [mm]
dz = 5.9 # Bounding box z dimension [mm]
rz = 0.0 # Rotation around face normal [degrees]
side = "OUT" # Mount on inner or outer face
cad_file = "" # CAD document name (empty = generate box)
cad_offset_x = 0.0 # CAD bounding box center offset x [mm]
cad_offset_y = 0.0 # CAD bounding box center offset y [mm]
cad_offset_z = 0.0 # CAD bounding box center offset z [mm]
update_bbox = 0 # Set to 1 to auto-update bbox from CAD

[sun_sensers.main.design.power_modes] # OperationMode 別の on/off
initial = false
bdot = false
rough_sun_pointing = true
rough_three_axis_mtq = true
rough_three_axis_rw = true
fine_three_axis = true
imaging = true
xband_downlink = true



# === Reaction Wheel (RW0003 × 3 — 3軸直交配置) ===
# [S2E] 全値 rw0003.ini より。Sinclair Interplanetary / Rocket Lab
# 最大トルク 4 mNm、ロータ慣性 3.372e-6 kg·m², 最大 8500 rpm



# === Reaction Wheel ===

[reaction_wheels.spec]
mass_kg = 0.068 # 質量 [kg]
temp_min_c = -30.0 # 動作温度下限 [degC]
temp_max_c = 60.0 # 動作温度上限 [degC]
power_per_unit_w = 0.88 # 単位あたりの想定消費電力 [W]
max_torque_nms = 0.004 # 最大出力トルク [N*m]
max_momentum_nms = 0.002999 # 角運動量容量（ω_max × I_rotor） [N*m*s]
rotor_inertia_kg_m2 = 3.372e-6 # ロータ慣性モーメント [S2E rw0003.ini] [kg*m^2]
max_speed_rpm = 8500.0 # 最大回転速度 [S2E rw0003.ini] [rpm]

[reaction_wheels.main.design]
quantity = 3 # 搭載個数

[reaction_wheels.main.design.placement] # 搭載位置・CAD パラメータ
face = "MZ" # Panel face to mount on
u = 0.0 # Position along face u-axis [mm]
v = 0.0 # Position along face v-axis [mm]
w = 0.0 # Offset from face surface [mm]
dx = 33.5 # Bounding box x dimension [mm]
dy = 33.5 # Bounding box y dimension [mm]
dz = 17.0 # Bounding box z dimension [mm]
rz = 0.0 # Rotation around face normal [degrees]
side = "IN" # Mount on inner or outer face
cad_file = "" # CAD document name (empty = generate box)
cad_offset_x = 0.0 # CAD bounding box center offset x [mm]
cad_offset_y = 0.0 # CAD bounding box center offset y [mm]
cad_offset_z = 0.0 # CAD bounding box center offset z [mm]
update_bbox = 0 # Set to 1 to auto-update bbox from CAD

[reaction_wheels.main.design.power_modes] # OperationMode 別の on/off
initial = false
bdot = false
rough_sun_pointing = false
rough_three_axis_mtq = false
rough_three_axis_rw = true
fine_three_axis = true
imaging = true
xband_downlink = true



# === Magnetic Torquer (MTQ SEIREN × 3軸) ===
# [S2E] mtq_seiren.ini — 5.0 V / 0.65 W、各軸 ±0.32 A·m²
# 設計: ISSL (東京大学 中須賀・船瀬研)



# === Magnetic Torquer ===

[magnetic_torquers.spec]
mass_kg = 0.050 # 質量 [kg]
power_per_unit_w = 0.65 # 単位あたりの想定消費電力 [W]
max_dipole_moment_am2 = 0.32 # 最大磁気モーメント（片軸） [A*m^2]

[magnetic_torquers.main.design]
quantity = 3 # 搭載個数

[magnetic_torquers.main.design.placement] # 搭載位置・CAD パラメータ
face = "MZ" # Panel face to mount on
u = 0.0 # Position along face u-axis [mm]
v = 0.0 # Position along face v-axis [mm]
w = 0.0 # Offset from face surface [mm]
dx = 100.0 # Bounding box x dimension [mm]
dy = 10.0 # Bounding box y dimension [mm]
dz = 10.0 # Bounding box z dimension [mm]
rz = 0.0 # Rotation around face normal [degrees]
side = "IN" # Mount on inner or outer face
cad_file = "" # CAD document name (empty = generate box)
cad_offset_x = 0.0 # CAD bounding box center offset x [mm]
cad_offset_y = 0.0 # CAD bounding box center offset y [mm]
cad_offset_z = 0.0 # CAD bounding box center offset z [mm]
update_bbox = 0 # Set to 1 to auto-update bbox from CAD

[magnetic_torquers.main.design.power_modes] # OperationMode 別の on/off
# RW 制御モードでも MTQ は ON（間欠 desat duty）。RW は ~20分で飽和するため
# fine/imaging/xband でも MTQ で角運動量を継続アンロードする（verify_mtq_can_desaturate_rw）。
initial = false
bdot = true
rough_sun_pointing = true
rough_three_axis_mtq = true
rough_three_axis_rw = true
fine_three_axis = true
imaging = true
xband_downlink = true



