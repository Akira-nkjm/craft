# AOCS system instance data — ONGLAISAT (6U 地球観測 CubeSat)
#
# Source: ONGLAISAT AOCS
#   - S2E ini: 99_Sources/raw/s2e-aobc-initialize_files/components/
#   - 質量表: 99_Sources/raw/mass_inertia_breakdown.csv (「5.AOCS」行)
#   - MD: 02_AOCS/*.md
#
# 運用モード (8 mode): initial / bdot / rough_sun_pointing / rough_three_axis_mtq /
#                      rough_three_axis_rw / fine_three_axis / imaging / xband_downlink



# === Sun Sensor (nanoSSOC-D60 × 4) ===
# [確定値] 質量 6.7 g/個 (mass_inertia_breakdown.csv 5.AOCS)
# [S2E] 消費電力 0.07 W / FOV 60 deg (nanossoc_d60.ini)
# 搭載面: PY/MY/PZ/MZ の 4 面。rough_sun_pointing 以降全モードで ON。

[sun_sensers.spec]
mass_kg = 0.0067          # [確定値] 6.7 g/個 (mass_inertia_breakdown.csv)
power_per_unit_w = 0.07   # [S2E] nanossoc_d60.ini assumed_power_consumption_W
fov_deg = 60.0            # [S2E] nanossoc_d60.ini field_of_view 60 deg (半角)

[sun_sensers.main.design]
quantity = 4              # PY/MY/PZ/MZ 4 面 [S2E number_of_mounted_sensors=4]

[sun_sensers.main.design.placement]
face = "PY"
u = 0.0
v = 0.0
w = 0.0
dx = 27.0
dy = 14.0
dz = 5.9
rz = 0.0
side = "OUT"
cad_file = ""
cad_offset_x = 0.0
cad_offset_y = 0.0
cad_offset_z = 0.0
update_bbox = 0

[sun_sensers.main.design.power_modes]
initial = false
bdot = false
rough_sun_pointing = true
rough_three_axis_mtq = true
rough_three_axis_rw = true
fine_three_axis = true
imaging = true
xband_downlink = true



# === Reaction Wheel (RW0003 × 3 — 3軸直交配置) ===
# [S2E] 全値 rw0003.ini より。Sinclair Interplanetary / Rocket Lab
# 最大トルク 4 mNm、ロータ慣性 3.372e-6 kg·m², 最大 8500 rpm

[reaction_wheels.spec]
mass_kg = 0.068
temp_min_c = -30.0
temp_max_c = 60.0
power_per_unit_w = 0.88       # [S2E] rw0003.ini 0.88 W/台
max_torque_nms = 0.004        # [S2E] rw0003.ini max_output_torque = 0.004 N·m
max_momentum_nms = 0.002999   # [推定] I*ω_max = 3.372e-6*890 rad/s ≈ 3e-3 N·m·s [TBD]
rotor_inertia_kg_m2 = 3.372e-6  # [S2E] rw0003.ini moment_of_inertia
max_speed_rpm = 8500.0        # [S2E] rw0003.ini max_angular_velocity

[reaction_wheels.main.design]
quantity = 3                  # [確定値] 3軸直交 (X/Y/Z 軸)

[reaction_wheels.main.design.placement]
face = "MZ"
u = 0.0
v = 0.0
w = 0.0
dx = 33.5
dy = 33.5
dz = 17.0
rz = 0.0
side = "IN"
cad_file = ""
cad_offset_x = 0.0
cad_offset_y = 0.0
cad_offset_z = 0.0
update_bbox = 0

[reaction_wheels.main.design.power_modes]
initial = false
bdot = false
rough_sun_pointing = false
rough_three_axis_mtq = false
rough_three_axis_rw = true
fine_three_axis = true
imaging = true
xband_downlink = true



