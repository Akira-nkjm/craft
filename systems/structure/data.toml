# Structure system instance data
#
# Source: ONGLAISAT（6U 地球観測 CubeSat）構体系
#   - [S2E]  s2e-mobc-settings/.../satellite_structure.ini（フライト確定 質量・慣性・表面）
#   - [CSV]  99_Sources/raw/mass_inertia_breakdown.csv §1.structure（部品表 CAD-DD 列）
#   - [PCDU] 03_Power/PCDU.md §4（HRM ch12 5.19W）
#   - [MD]   08_Structure/Structure and Configuration.md
#   - [MB]   00_System/Mass Budget.md
#
# 値の信頼性凡例:
#   [確定値] = S2E ini / SAP-DD CAD 列（フライトモデル反映）
#   [推定]   = CAD 参照値・設計途中値
#   TBD      = 未確定



# === Frames ===
# Sony Group 共同開発・製造（PX/MX frame_sony）。CSV §1.structure CAD-DD 列から採用。
# 全アルミ（密度 2.7 g/cm³）構造。[CSV §1.structure]

[frames.spec]
mass_kg            = 0.17256   # PX frame_sony 172.56g — 代表 spec [確定値 CAD-DD]
material           = "Al"      # アルミ 密度 2.7 g/cm³ [CSV §1.structure]
yield_strength_mpa = 0.0       # TBD（合金グレード未確定）

[frames.px_frame.design]
quantity = 1

[frames.px_frame.design.placement]
face         = "PX"
u            = 0.0
v            = 0.0
w            = 0.0
dx           = 100.0   # 機体エンベロープ X [S2E 面定義]
dy           = 226.3   # 機体エンベロープ Y [S2E]
dz           = 366.0   # 機体エンベロープ Z [S2E]
rz           = 0.0
side         = "IN"
cad_file     = ""
cad_offset_x = 0.0
cad_offset_y = 0.0
cad_offset_z = 0.0
update_bbox  = 0

[frames.px_frame.meta]
notes = "PX frame_sony 172.56g — Sony 製フレーム [確定値 CAD-DD]"


