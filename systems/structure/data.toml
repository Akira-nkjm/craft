# Structure system instance data
#
# Source: ONGLAISAT（6U 地球観測 CubeSat）構体系
#   - [S2E]  s2e-mobc-settings/.../satellite_structure.ini（フライト確定 質量・慣性・表面）
#   - [CSV]  99_Sources/raw/mass_inertia_breakdown.csv §1.structure（部品表 CAD-DD 列）
#   - [PCDU] 03_Power/PCDU.md §4（HRM ch12 5.19W）
#   - [MD]   08_Structure/Structure and Configuration.md
#   - [MB]   00_System/Mass Budget.md
#
# 値の信頼性凡例:
#   [確定値] = S2E ini / SAP-DD CAD 列（フライトモデル反映）
#   [推定]   = CAD 参照値・設計途中値
#   TBD      = 未確定



