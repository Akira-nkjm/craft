# === Hold/Release Mechanisms ===
# HRM-008-HRM ASSY × 2（SAP 拘束・解放）。
# PCDU ch12 経由 5.19W 駆動（12V × 3.6A 電流制限）。展開後 1 回のみ駆動。
# HRM-DCDC PCB ASSY1(19.02g)/ASSY2(19.18g) は power.data.toml 側で別計上。
# [CSV §3.Power / PCDU.md §4 ch12]

[hold_release_mechanisms.spec]
mass_kg           = 0.14150   # HRM-008-HRM ASSY 単体 141.5g [確定値 CSV]
power_per_unit_w  = 5.19      # ch12 PCDU 定格 5.19W [PCDU.md §4]
release_mechanism = "burn_wire"

[hold_release_mechanisms.sap_hrm.design]
quantity = 2  # HRM-008-HRM ASSY × 2 [確定値 CSV]

[hold_release_mechanisms.sap_hrm.design.placement]
face         = "PZ"
u            = 0.0
v            = 0.0
w            = 0.0
dx           = 60.0
dy           = 60.0
dz           = 40.0
rz           = 0.0
side         = "OUT"
cad_file     = ""
cad_offset_x = 0.0
cad_offset_y = 0.0
cad_offset_z = 0.0
update_bbox  = 0

# 展開後 1 回のみ駆動 — 通常運用中は全モード OFF
[hold_release_mechanisms.sap_hrm.design.power_modes]
initial              = false
bdot                 = false
rough_sun_pointing   = false
rough_three_axis_mtq = false
rough_three_axis_rw  = false
fine_three_axis      = false
imaging              = false
xband_downlink       = false

[hold_release_mechanisms.sap_hrm.meta]
notes = "HRM-008-HRM ASSY ×2 = 283g。PCDU ch12 5.19W は展開時瞬時消費。DCDC PCB ASSY1/2 は power 系で別計上 [CSV / PCDU.md §4]"



