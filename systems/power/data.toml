# Power system instance data
#
# Source: ONGLAISAT（6U 地球観測 CubeSat）電源系（EPS）
#   - [SAP-MasterSheet] SAP_MasterSheet_CESI_CTJ30.csv（発電・MPPT・アレイ性能 確定値）
#   - [SPHERE論文] 宇科連2023 SPHERE-1 EYE バッテリ・太陽電池（共通6Uバス）
#   - [S2E] s2e-mobc-settings/.../power/{sap,pcdu,battery}.ini
#   - 質量: mass_inertia_breakdown.csv「3.Power」



# === Battery (Li-ion 2P3S × 1) ===
# BAT_kumitate_asm 618.55g, モジュール 84×83×54mm。SPHERE-1 EYE 共通モジュール。

[batteries.spec]
mass_kg = 0.61855 # 質量 [kg]
temp_min_c = -10.0 # 動作温度下限 [degC]
temp_max_c = 45.0 # 動作温度上限 [degC]
capacity_wh = 73.0 # パックエネルギー [Wh]
capacity_ah = 6.6 # パック容量（並列込み） [Ah]
nominal_voltage_v = 11.1 # パック公称電圧 [V]
series_count = 3 # 直列セル数
parallel_count = 2 # 並列セル数
max_charge_voltage_v = 12.3 # CV 充電電圧上限 [V]
charge_current_rate_c = 0.4 # CC 充電レート [C] [1/h]
internal_resistance_ohm = 0.20 # 内部+配線抵抗 [ohm]
manufacturer = "ISSL/ArkEdge (SPHERE-1 EYE 共通モジュール)" # Manufacturer

[batteries.main.design]
quantity = 1 # 搭載個数
depth_of_discharge = 0.3 # 設計時 DoD（初期）

[batteries.main.design.placement] # 搭載位置・CAD パラメータ
face = "MY" # Panel face to mount on
u = 0.0 # Position along face u-axis [mm]
v = 50.0 # Position along face v-axis [mm]
w = 0.0 # Offset from face surface [mm]
dx = 84.0 # Bounding box x dimension [mm]
dy = 83.0 # Bounding box y dimension [mm]
dz = 54.0 # Bounding box z dimension [mm]
rz = 0.0 # Rotation around face normal [degrees]
side = "IN" # Mount on inner or outer face
cad_file = "" # CAD document name (empty = generate box)
cad_offset_x = 0.0 # CAD bounding box center offset x [mm]
cad_offset_y = 0.0 # CAD bounding box center offset y [mm]
cad_offset_z = 0.0 # CAD bounding box center offset z [mm]
update_bbox = 0 # Set to 1 to auto-update bbox from CAD

[batteries.main.requirements]
depth_of_discharge_max = 0.5 # 要求 DoD 上限

[batteries.main.meta]
notes = "2P3S 6.6Ah ~73Wh。保護: 過充電12.6V/復帰12.2V, 過放電7.8V, 過電流7.0A。気密構造"



# === Solar Array Panel (CESI CTJ30, 7s8p = 56 cells) ===
# SAP-ASSY-D1-4_OPEN ×2 wing = 984.56g。電気設計の正 = マスターシート(56セル)。
# 1 アレイ（56 セル）として 1 インスタンスで電気モデル化（quantity=1）。



# === Solar Panel ===

[solar_panels.spec]
mass_kg = 0.98456 # 質量 [kg]
temp_min_c = -80.0 # 動作温度下限 [degC]
temp_max_c = 100.0 # 動作温度上限 [degC]
area_m2 = 0.148456 # アレイ総セル面積 [m^2]
default_power_generation_per_unit_w = 52.56 # BOL 発生電力（MPPT 損失込み） [W]
bol_power_w = 52.56 # BOL 発生電力（MPPT 込み） [W]
eol_power_w = 50.53 # EOL 発生電力（MPPT 込み） [W]
efficiency = 0.288 # セル効率 @AM0
cell_type = "CESI CTJ30 SCA (InGaP/GaAs/Ge)" # セル品種

[solar_panels.sap_array_px.design]
quantity = 1 # 搭載個数
cell_count = 28 # 7 直 × 4 並
string_count = 8

[solar_panels.sap_array_px.design.placement] # 搭載位置・CAD パラメータ
face = "PZ" # Panel face to mount on
u = 233.0 # Position along face u-axis [mm]
v = 0.0 # Position along face v-axis [mm]
w = 0.0 # Offset from face surface [mm]
dx = 366.0 # Bounding box x dimension [mm]
dy = 453.0 # Bounding box y dimension [mm]
dz = 2.0 # Bounding box z dimension [mm]
rz = 0.0 # Rotation around face normal [degrees]
side = "OUT" # Mount on inner or outer face
cad_file = "" # CAD document name (empty = generate box)
cad_offset_x = 0.0 # CAD bounding box center offset x [mm]
cad_offset_y = 0.0 # CAD bounding box center offset y [mm]
cad_offset_z = 0.0 # CAD bounding box center offset z [mm]
update_bbox = 0 # Set to 1 to auto-update bbox from CAD

[solar_panels.sap_array_mx.design]
quantity = 1 # 搭載個数
cell_count = 28 # 7 直 × 4 並
string_count = 8

[solar_panels.sap_array_mx.design.placement] # 搭載位置・CAD パラメータ
face = "PZ" # Panel face to mount on
u = -233.0 # Position along face u-axis [mm]
v = 0.0 # Position along face v-axis [mm]
w = 0.0 # Offset from face surface [mm]
dx = 366.0 # Bounding box x dimension [mm]
dy = 453.0 # Bounding box y dimension [mm]
dz = 2.0 # Bounding box z dimension [mm]
rz = 0.0 # Rotation around face normal [degrees]
side = "OUT" # Mount on inner or outer face
cad_file = "" # CAD document name (empty = generate box)
cad_offset_x = 0.0 # CAD bounding box center offset x [mm]
cad_offset_y = 0.0 # CAD bounding box center offset y [mm]
cad_offset_z = 0.0 # CAD bounding box center offset z [mm]
update_bbox = 0 # Set to 1 to auto-update bbox from CAD

[solar_panels.sap_array_mx.meta]
notes = "MPPT 制御（ストリング毎 DCDC）。±Z 面配置(84セル)は参考、電気設計は56セル/マスターシート"



# === PCDU (PCDU_rev3 × 1) ===
# 267.52g, 13ch, 12V/5V バス, RS422(PCU_PIC1) で MOBC 接続。SAP→バス伝送効率 0.9.



# === PDM ===

[pdms.spec]
mass_kg = 0.26752 # 質量 [kg]
power_per_unit_w = 1.0 # 単位あたりの想定消費電力 [W]
rated_current_a = 20.0 # [A]
bus_voltage_v = 12.0 # 主バス電圧 [V]
channel_count = 13 # 出力チャネル数

[pdms.pcdu.design]
quantity = 1 # 搭載個数
efficiency = 0.9 # SAP→12V バス伝送効率

[pdms.pcdu.design.placement] # 搭載位置・CAD パラメータ
face = "MY" # Panel face to mount on
u = 0.0 # Position along face u-axis [mm]
v = 0.0 # Position along face v-axis [mm]
w = 0.0 # Offset from face surface [mm]
dx = 90.0 # Bounding box x dimension [mm]
dy = 87.0 # Bounding box y dimension [mm]
dz = 30.0 # Bounding box z dimension [mm]
rz = 0.0 # Rotation around face normal [degrees]
side = "IN" # Mount on inner or outer face
cad_file = "" # CAD document name (empty = generate box)
cad_offset_x = 0.0 # CAD bounding box center offset x [mm]
cad_offset_y = 0.0 # CAD bounding box center offset y [mm]
cad_offset_z = 0.0 # CAD bounding box center offset z [mm]
update_bbox = 0 # Set to 1 to auto-update bbox from CAD

[pdms.pcdu.design.power_modes] # OperationMode 別の on/off
initial = true
bdot = true
rough_sun_pointing = true
rough_three_axis_mtq = true
rough_three_axis_rw = true
fine_three_axis = true
imaging = true
xband_downlink = true
