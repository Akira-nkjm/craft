[project]
name = "craft"
version = "0.1.0"
description = "Concept Registry for Automated spacecraFT design"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "veriq>=0.4.2",
    "toolbox",
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "tomli-w>=1.2.0",
    "typer>=0.25.1",
    "mcp>=1.27.1",
    "tomlkit>=0.15.0",
    "marimo>=0.23.9",
    "plotly>=5.20",
]

[project.scripts]
craft = "craft.cli.main:main"
craft-mcp = "craft.mcp_server.server:main"

# veriq / toolbox は PyPI 未公開（または公開版が古く未リリース API に依存）。
# 単体ビルド/CI では GitHub から取得する:
#   - veriq: 開発ブランチ feat/scope-input（load_model_data / Scope(input=...) を含む）
#   - toolbox: main（systems/ の @analysis が解析カーネルとして利用）
# どちらも public。hub workspace 側ではこれらを editable path source で参照する。
[tool.uv.sources]
veriq = { git = "https://github.com/ut-issl/veriq.git", branch = "feat/scope-input" }
toolbox = { git = "https://github.com/Akira-nkjm/toolbox.git", branch = "main" }

[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
    "ruff>=0.15.14",
    "pytest>=9.0.3",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.0",
    "zensical>=0.0.43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/craft", "systems"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
    ".venv",
    ".worktrees",
    ".codegraph",
    ".claude/tools",
    "claude-settings",
    "plan",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "N",
]
# B008: FastAPI の Body / Depends / Header を default 値に置くのは推奨パターン
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = [
    "**/.venv/**",
    "**/.worktrees/**",
    "**/.codegraph/**",
    "plan/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
